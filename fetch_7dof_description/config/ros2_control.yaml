controller_manager:
  ros__parameters:
    # 25 Hz matches the Gymnasium pick-and-place control frequency
    # (one action applied for 20 substeps of dt=0.002 s).
    update_rate: 25
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    hand_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - upperarm_roll_joint
      - elbow_flex_joint
      - forearm_roll_joint
      - wrist_flex_joint
      - wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_joint_trajectory_controller:
  ros__parameters:
    joints:
      - r_gripper_finger_joint
      - l_gripper_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# 7-DOF FreeCAD hand (Option B). H1..H5 = wrist/palm revolute joints.
# H6/H7 (finger_L/R_prismatic) are Fetch-compatible (0..0.05 m) and are
# aliased here alongside the stock gripper controller for hand-only demos.
hand_joint_trajectory_controller:
  ros__parameters:
    joints:
      - hand_yaw_joint
      - hand_pitch_joint
      - hand_roll_joint
      - knuckle_spread_L_joint
      - knuckle_spread_R_joint
      - finger_L_prismatic_joint
      - finger_R_prismatic_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
