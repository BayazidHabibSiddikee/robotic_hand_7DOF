controller_manager:
  ros__parameters:
    update_rate: 25
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    hand_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - upperarm_roll_joint
      - elbow_flex_joint
      - forearm_roll_joint
      - wrist_flex_joint
      - wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# V2 5-finger anthropomorphic hand — 7 actuated joints.
# Each MCP joint drives its own finger via mimic joints (PIP 0.85×, DIP 0.6×PIP).
# Thumb has 2 independent joints: CMC opposition (Z) + MCP flexion (Y).
hand_joint_trajectory_controller:
  ros__parameters:
    joints:
      - thumb_cmcmc_joint       # A1: thumb opposition  ±45°
      - thumb_mcp_joint         # A2: thumb flexion     0..90°
      - index_mcp_joint         # A3: index flexion     0..90°
      - middle_mcp_joint        # A4: middle flexion    0..90°
      - ring_mcp_joint          # A5: ring flexion      0..90°
      - little_mcp_joint        # A6: little flexion    0..90°
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# STS3215 servo specs per joint (for Gazebo JointPositionController PID tuning)
# 55g, 45.2×24.7×35mm, 2.94N·m stall / 0.98N·m rated, 10:1 gearbox
hand_motor_parameters:
  ros__parameters:
    thumb_cmcmc:
      motor_inertia: [7.3e-6, 1.37e-5, 1.19e-5]
      mechanical_reduction: 10.0
      motor_mass: 0.055
    thumb_mcp:
      motor_inertia: [7.3e-6, 1.37e-5, 1.19e-5]
      mechanical_reduction: 10.0
      motor_mass: 0.055
    index_mcp:
      motor_inertia: [7.3e-6, 1.37e-5, 1.19e-5]
      mechanical_reduction: 10.0
      motor_mass: 0.055
    middle_mcp:
      motor_inertia: [7.3e-6, 1.37e-5, 1.19e-5]
      mechanical_reduction: 10.0
      motor_mass: 0.055
    ring_mcp:
      motor_inertia: [7.3e-6, 1.37e-5, 1.19e-5]
      mechanical_reduction: 10.0
      motor_mass: 0.055
    little_mcp:
      motor_inertia: [7.3e-6, 1.37e-5, 1.19e-5]
      mechanical_reduction: 10.0
      motor_mass: 0.055
