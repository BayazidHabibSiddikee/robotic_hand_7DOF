controller_manager:
  ros__parameters:
    # 25 Hz matches the Gymnasium pick-and-place control frequency
    # (one action applied for 20 substeps of dt=0.002 s).
    update_rate: 25
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - upperarm_roll_joint
      - elbow_flex_joint
      - forearm_roll_joint
      - wrist_flex_joint
      - wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_joint_trajectory_controller:
  ros__parameters:
    joints:
      - r_gripper_finger_joint
      - l_gripper_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
